name: Server Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pine-script-extension/server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: pine-script-extension/server

      - name: Build server
        run: npm run build
        working-directory: pine-script-extension/server

      - name: Run server tests
        run: node out/test/test_runner.js
        working-directory: pine-script-extension/server
